name: Publish Android release asset

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic app version, for example 1.0.2
        required: true
        type: string
      artifact_url:
        description: Signed EAS APK URL
        required: true
        type: string
      sha256:
        description: Expected APK SHA-256
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify signed APK
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          asset="Prime-Novel-${VERSION}.apk"
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output "$asset"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$asset" | sha256sum --check --strict

      - name: Attach APK to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v${VERSION}-android" "Prime-Novel-${VERSION}.apk" --repo "$GITHUB_REPOSITORY" --clobber
