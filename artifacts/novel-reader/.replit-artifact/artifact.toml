kind = "mobile"
previewPath = "/"
title = "Novel Reader"
description = "A focused mobile web-novel reader that opens into your current book, organizes a lived-in library, surfaces updates, and makes discovering source collections feel effortless."
version = "1.0.0"
id = "artifacts/novel-reader"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24974

[services.development]
run = "pnpm --filter @workspace/novel-reader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/novel-reader", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/novel-reader", "run", "serve" ]

[services.env]
PORT = "24974"
BASE_PATH = "/"
